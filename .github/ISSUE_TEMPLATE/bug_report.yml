name: Bug report
description: Report something that does not work as expected.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and include any relevant error output.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What should have happened?
      description: Describe the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Include the command or steps and a small code example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Bylaws version, OS and how you run Bylaws. Add Swift or build tool versions if relevant.
    validations:
      required: true
